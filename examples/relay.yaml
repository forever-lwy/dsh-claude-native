# 合并到 profile 的 cordis.patch.yml（不要覆盖整个文件，也不要新建同 id 的重复条目）。
# 中转站：Anthropic 原生协议根地址 + Bearer 认证。API Key 请在模型页输入，
# 只会写入 dsh 凭据存储中名为 apiKeyEnv 的条目，不会出现在此文件中。
- id: dsh-claude-native
  name: '@forever-lwy/dsh-claude-native'
  config:
    claude:
      baseURL: https://relay.example.com      # 可带或不带 /v1
      authMode: bearer                         # 官方 API 使用 x-api-key
      apiKeyEnv: CLAUDE_RELAY_API_KEY
      refusalFallback: auto                    # auto 对非官方端点不发送 fallbacks
      cache:
        enabled: true
        ttl: 5m
      models:
        - id: claude-opus-5-5                  # 已知 ID 会套用核对过的思考档位与容量
        - id: claude-sonnet-5-5
